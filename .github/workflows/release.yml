name: Release Android app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, such as v1.0.0."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Restore signing key
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Set all Android signing secrets before publishing a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        shell: bash
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PreleaseVersionName="$VERSION" \
            -PreleaseVersionCode="$GITHUB_RUN_NUMBER" \
            -PreleaseStoreFile="$RUNNER_TEMP/release.keystore" \
            -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" \
            -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          gh release create "$TAG" "$apk#tablet-launcher-$VERSION.apk" \
            --title "Tablet Launcher $VERSION" \
            --generate-notes
